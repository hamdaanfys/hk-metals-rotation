# HK metals/mining basket for the sector-rotation detector.
#
# The fallback market caps are rough current HKD values used only if yfinance
# cannot return marketCap. The script writes the final weights it used to
# outputs/metals_basket_weights.csv so the assumptions are always visible.
#
# 2259.HK Zijin Gold is deliberately excluded from the basket because
# it does not have 3+ years of listed history.
name: HK Diversified Metals & Mining basket
# Primary benchmark: drives the timing table. sanity_benchmarks are charted
# alongside it as a cross-check. --benchmarks on the command line overrides both.
benchmark: ^HSCE
sanity_benchmarks:
  - ^HSI
constituents:
  - ticker: 2899.HK
    name: Zijin Mining
    fallback_market_cap_hkd_bn: 900
  - ticker: 1378.HK
    name: China Hongqiao
    fallback_market_cap_hkd_bn: 337
  - ticker: 3993.HK
    name: CMOC Group
    fallback_market_cap_hkd_bn: 190
  - ticker: 1208.HK
    name: MMG
    fallback_market_cap_hkd_bn: 121
  - ticker: 1818.HK
    name: Zhaojin Mining
    fallback_market_cap_hkd_bn: 106
  - ticker: 2600.HK
    name: Aluminum Corporation of China
    fallback_market_cap_hkd_bn: 90
  - ticker: 0358.HK
    name: Jiangxi Copper
    fallback_market_cap_hkd_bn: 75
  - ticker: 1772.HK
    name: Ganfeng Lithium
    fallback_market_cap_hkd_bn: 65
  - ticker: 1258.HK
    name: China Nonferrous Mining
    fallback_market_cap_hkd_bn: 35
  - ticker: 9696.HK
    name: Tianqi Lithium
    fallback_market_cap_hkd_bn: 25

# Phase 3 parameters. Fixed and committed before any evaluation was run on the
# 2016+ history; see git history. Change them only with a note in the README.
signal:
  # Real-time rotation-onset signal. Turnover z-scores are per stock, on log
  # HKD turnover vs that stock's trailing window (excluding today), then
  # weight-averaged over stocks with a full window.
  turnover_z_window: 252
  z_threshold: 2.0
  count_window: 10
  min_count: 3
  rs_ma_window: 50
  onset_min_off_days: 20
lift_label:
  # POST-HOC REVISION: after the first evaluation run, the pre-registered
  # ("original") rule was found to miss visible major rallies, such as 2025-26:
  # the condition switched on, failed the hold, and never switched off, so no
  # lift was ever labelled. A "revised" rule (first day in each switched-on run
  # that passes the hold) is now reported alongside the original. The
  # parameters below are unchanged and shared by both rules. Both rules are
  # frozen: no further changes. See scripts/evaluation.py and the README.
  #
  # Hindsight label for evaluation only. A lift is the first day the
  # ma_window-day average of relative strength is at least min_rise above the
  # lowest relative strength of the prior base_window sessions, stays at least
  # that far above that base for hold_sessions sessions (from the lift day),
  # and is at least min_gap sessions after the previous lift.
  ma_window: 20
  base_window: 60
  min_rise: 0.05
  hold_sessions: 20
  min_gap: 60
evaluation:
  horizons: [20, 60]
  # Forward returns start at the close entry_lag sessions after the onset.
  entry_lag: 1
  permutations: 10000
  seed: 20260926
  lift_lead_window: 60
  lift_late_window: 20
  false_alarm_window: 60
  sensitivity:
    z_threshold: [1.5, 2.0, 2.5]
    count_rule: [[3, 10], [5, 20]]
